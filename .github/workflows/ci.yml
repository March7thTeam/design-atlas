name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # This project has no npm dependencies or lockfile to install.
      - name: Build offline bundle
        run: npm run build
      - name: Check generated pages and catalogs
        run: npm run check
      - name: Check cases and recipes
        run: npm run check:cases
      - name: Check workspace and studio
        run: npm run check:studio
      - name: Check effects and editor
        run: npm run check:fx
